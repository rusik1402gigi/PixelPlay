name: One-Click Auto Build PixelPlay IPA
on:
push:
branches: [ "main", "master" ]
workflow_dispatch:
jobs:
build-ipa:
runs-on: macos-14
steps:
- name: Checkout repository
uses: actions/checkout@v4
- name: Create XcodeGen Configuration Automatically
run: |
cat << 'EOF' > project.yml
name: PixelPlay
options:
bundleIdPrefix: com.pixelplay
targets:
PixelPlay:
type: application
platform: iOS
deploymentTarget: "16.0"
sources:
- ContentView.swift
settings:
base:
INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
INFOPLIST_KEY_UILaunchScreen_Generation: YES
INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
PRODUCT_BUNDLE_IDENTIFIER: com.pixelplay.ios
GENERATE_INFOPLIST_FILE: YES
EOF
- name: Install XcodeGen & Generate Project
run: |
brew install xcodegen
xcodegen generate
- name: Compile Unsigned iOS App
run: |
xcodebuild clean build 
-project PixelPlay.xcodeproj 
-scheme PixelPlay 
-sdk iphoneos 
-configuration Release 
-derivedDataPath build 
CODE_SIGN_IDENTITY="" 
CODE_SIGNING_REQUIRED=NO 
CODE_SIGNING_ALLOWED=NO
- name: Package into PixelPlay.ipa
run: |
mkdir -p Payload
cp -r build/Build/Products/Release-iphoneos/PixelPlay.app Payload/
zip -r PixelPlay.ipa Payload
- name: Upload Ready-to-Install IPA
uses: actions/upload-artifact@v4
with:
name: PixelPlay-IPA
path: PixelPlay.ipa